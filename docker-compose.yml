services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/server/data
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    working_dir: /app
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
